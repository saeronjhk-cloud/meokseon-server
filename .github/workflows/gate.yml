# ==============================================================================
#  먹선 서버 — 배포 게이트  (세션49 신설)
#
#  왜 이 파일이 있는가
#    세션48 외부 검증 2인이 공통으로 지목한 0순위: main 에 push 하면 Railway 가
#    즉시 배포한다. 발견과 사용자 노출 사이에 완충지대가 0 이다.
#    이 워크플로는 그 완충지대다. Railway 서비스 설정의 `Wait for CI` 를 켜면
#    여기가 초록일 때만 배포가 진행된다(실패하면 배포는 SKIPPED).
#    ★ Railway 의 Wait for CI 는 워크플로에 `on: push: branches: [main]` 이
#      있어야 인식된다. 아래 트리거를 함부로 바꾸지 말 것.
#
#  두 개의 축
#    job: regression   — pglite(=PostgreSQL 18.3) 위에서 커밋 게이트 전량.
#                        run-commit-session48.bat 의 STEP 1+2 와 같은 목록이다.
#                        ★ Node 20 과 22 양쪽에서 돌린다. Dockerfile 은 node:20-alpine
#                          인데 개발·테스트는 Node 22 였다. 그 드리프트를 여기서 닫는다.
#    job: real-postgres — 진짜 PostgreSQL 컨테이너에 000_baseline.sql 을 실제로
#                        적용하고, 앱을 그 DB 에 붙여 부팅시킨다.
#                        pglite 가 원리적으로 못 보는 것을 본다:
#                          · pg_trgm 이 실제로 생성되어 trigram GIN 인덱스 8개가 만들어지는가
#                          · GENERATED ALWAYS AS (...) STORED 가 도는가
#                          · ALTER TYPE ... ADD VALUE 가 트랜잭션 밖에서 도는가
#                          · psql 이 ON_ERROR_STOP=1 에서 정말 멈추는가
#
#  하지 말 것
#    ❌ 스위트를 한 줄로 && 로 잇지 말 것. 어느 것이 빨강인지 안 보인다.
#    ❌ `continue-on-error: true` 를 붙이지 말 것. 그 순간 이 파일은 거짓 초록이 된다.
#    ❌ §F 스킵을 허용하지 말 것. 아래 assert 단계가 그것을 막는다.
# ==============================================================================
name: gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  regression:
    name: 회귀 게이트 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']   # 20 = Dockerfile(프로덕션) · 22 = 개발·세션48 검증 환경

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 의존성 설치 (lockfile 고정)
        run: npm ci

      # ── STEP 1 : 문법 + 부팅 ────────────────────────────────────────────────
      - name: 문법 검사 (커밋 게이트와 동일 목록)
        run: |
          set -e
          for f in \
            src/models/productModel.js \
            src/routes/ocrRoutes.js \
            src/routes/productRoutes.js \
            src/routes/userRoutes.js \
            src/services/mergeService.js \
            src/services/productService.js \
            src/services/allergenName.js \
            src/services/crowdsourceService.js \
            src/services/additiveResolver.js \
            src/services/analysisCache.js \
            src/services/authUserService.js \
            src/config/supabaseJwks.js \
            src/middleware/supabaseAuth.js \
            src/routes/contributionRoutes.js \
            src/routes/scanRoutes.js \
            src/services/foodTypeMatch.js \
            src/services/nutritionTrafficLight.js \
            src/services/pulseConsentService.js \
            src/services/raccPolicy.js \
            src/services/raccTable.js \
            src/utils/foodCategory.js \
            src/services/contributionApply.js \
            src/services/reviewQueueRead.js \
            src/services/reviewActions.js \
            src/services/collapseClassify.js \
            scripts/staging/off/collapse_classify.js \
            scripts/lib/allergenUpsert.js \
            scripts/19-apply-haccp.js \
            scripts/26-apply-haccp-dump.js \
            scripts/76-normalize-allergen-names.js \
            scripts/77-verify-fresh-schema.js \
            tests/test_allergen_name_normalize.js \
            tests/test_allergen_declared.js \
            tests/test_allergen_evidence_level.js \
            tests/test_parse_allergy.js \
            tests/test_path_parity.js \
            tests/test_allergen_contract.js \
            tests/test_schema_constraints.js \
            tests/test_ocr_confirm.js \
            tests/test_additive_union_save.js \
            tests/test_additive_unlisted.js \
            tests/test_promotion_rules.js \
            tests/test_allergen_ingredient_no_infer.js \
            tests/test_contribution_split_schema.js \
            tests/test_contribution_apply.js \
            tests/test_write_path_split.js \
            tests/test_review_queue_read.js \
            tests/test_contribution_apply_basis.js \
            tests/test_review_ui_render.js \
            tests/test_boot_graph.js
          do
            node --check "$f"
          done

      - name: package.json 이 유효한 JSON 인가
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: 앱이 부팅되는가
        run: node -e "require('./src/app')"

      # ★★ 세션66 (2026-09-01) — 「부팅된다」와 「배포되면 부팅된다」는 다르다.
      #   위 스텝은 **CI 체크아웃**에서 뜨는지만 본다. 그런데 운영은 **Docker 이미지**로 뜨고,
      #   `.dockerignore` 가 `scripts/staging/`·`scripts/merge/` 등을 «의도적으로» 제외한다.
      #   실제로 그 틈으로 Railway 배포가 죽었다 — 크래시 루프, **로그에 에러 0줄**.
      #   이 스텝이 그 틈을 막는다. 위 스텝 «바로 뒤»에 두는 이유다.
      - name: "test: boot-graph (배포되면 부팅되는가 · 세션66)"
        run: npm run test:boot-graph

      # ── STEP 2 : 회귀 (스위트마다 별도 단계 — 어느 것이 빨강인지 보이게) ────
      - name: "test: allergen"
        run: npm run test:allergen

      - name: 운영 덤프를 77 이 찾는 위치에 배치
        # 77 은 PROD_DUMP = <repo>/../IP/production_schema_2026-07-31.txt 를 본다.
        # 저장소 밖 경로라 CI 에서는 파일이 없어 §F 가 조용히 스킵된다(EXIT 0).
        # 이 저장소가 가장 경계하는 「거짓 초록」패턴이라 복사본을 심는다.
        # 정본은 D:\...\먹선\IP\ 이고 schema/ 는 복사본이다(IP 분리 원칙).
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/../IP"
          cp schema/production_schema_2026-07-31.txt "${GITHUB_WORKSPACE}/../IP/"

      - name: verify:fresh-schema  (+ §F 가 실제로 돌았는지 단정)
        run: |
          set -o pipefail
          npm run verify:fresh-schema | tee 77.log
          if ! grep -q '덤프가 담고 있는 테이블' 77.log; then
            echo "::error::§F(운영 덤프 성질 대조)가 돌지 않았다. 덤프 배치 단계를 확인할 것 — 이대로면 거짓 초록이다."
            exit 1
          fi

      - name: "test: contracts (parity / allergen / schema 대장 대조)"
        run: npm run test:contracts

      # ── 대장이 낡는 것을 막는 유일한 장치 ─────────────────────────────
      # 결함을 「고쳤다」고 선언하고 대장 줄을 지웠으면, 그 파일의 STRICT 는
      # 초록이어야 한다. 지우기만 하고 실제로는 안 고친 경우를 여기서 잡는다.
      # ⚠ PARITY_STRICT · ALLERGEN_STRICT 는 아직 빨강이 정상이다
      #   (D4·D5 / A1 4건이 대장에 남아 있다). 그 대장이 비면 여기에 추가할 것.
      - name: "STRICT: schema-constraints (PC1·PC2 — 세션49)"
        run: npm run test:schema-constraints:strict

      - name: "STRICT: parse-allergy (소실 3건 — 세션50)"
        run: npm run test:parse-allergy:strict

      - name: "test: merge"
        run: npm run test:merge

      - name: "test: ocr"
        run: npm run test:ocr

      # 세션64 — 제품명 확정 축(analysis_token · /confirm · 첫 원재료명 폴백 폐기).
      # ★ 별도 스텝인 이유: `test:ocr` 뒤에 && 로 이으면 어느 것이 빨강인지 안 보인다(위 「하지 말 것」).
      - name: "test: ocr-confirm (제품명 확정 · 세션64)"
        run: npm run test:ocr-confirm

      # 세션64b — 영양 미확보 «부분 저장» 축.
      #   영양 실패가 원재료·알레르기 저장까지 데려가지 않는가 / 영양 0개가 incomplete 인가 /
      #   미확보 제품에 신호등이 안 나가는가 / 알레르기 계약이 안 바뀌었는가 /
      #   개수가 관측으로만 쓰이는가 / 병합이 「모름」으로 기존 「앎」을 지우지 않는가.
      # ★ 별도 스텝인 이유: 위와 같다 — && 로 이으면 어느 것이 빨강인지 안 보인다.
      - name: "test: partial-save (영양 미확보 부분 저장 · 세션64b)"
        run: npm run test:partial-save

      # 세션64c — 「내 제보 이력」축(GET /api/contributions/mine · device_id 정본).
      #   식별자 없음(400)과 제보 0건(200 빈 목록)이 구분되는가 / 다른 기기 제보가 안 섞이는가 /
      #   페이징이 겹치지 않는가 / limit 상한이 있는가 / 제품 없는 제보가 안 사라지는가 /
      #   **개인정보(ocr_raw_text·user_input·device_id)가 응답에 안 실리는가** /
      #   /confirm 의 device_id 가 토큰 정본인가 / status 에 자동 전이가 «없다»는 사실 /
      #   24시간 중복 게이트가 «지금 발동하지 않는다»는 실측(고치면 재촬영 경로가 막힌다).
      # ★ 별도 스텝인 이유: 위와 같다 — && 로 이으면 어느 것이 빨강인지 안 보인다.
      - name: "test: contributions-mine (내 제보 이력 · 세션64c)"
        run: npm run test:contributions-mine

      # ★ 세션64c — 인증 통합(Firebase → Supabase). 제이 확정 2026-08-24.
      #   401 두 코드의 «구분»(AUTH_REQUIRED ≠ AUTH_INVALID) / exp 검증 /
      #   users UPSERT 멱등 / contributions.user_id 에 BIGINT 가 들어가는가 /
      #   supabase_uid 컬럼 부재 시 500 이 아니라 명확한 오류 /
      #   **제품 조회는 무인증으로 남아 있는가**(노션 §6·§9 획득 훅).
      # ★ 별도 스텝인 이유: && 로 이으면 어느 것이 빨강인지 안 보인다.
      - name: "test: supabase-auth (인증 통합 · 세션64c)"
        run: npm run test:supabase-auth

      # 세션65 C1 — `U64-3` 첨가물 «합집합» 저장(실측 소실 66.1% · 189 중 125).
      #   축 A(identifyAdditives)에만 있는 것이 저장되는가 / 축 B(원재료명 완전일치)가 살아 있는가 /
      #   `detected_name` 이 **라벨 원문**인가(마스터 이름이 아니라) /
      #   마스터에 없는 검출이 안 들어가는가 / `analysis.additives` 없음·빈배열에서 회귀 없는가 /
      #   `ON CONFLICT DO NOTHING` 이 유지되는가 / **경로 ②(mergeService)도 같은 합집합인가**.
      # ★ 별도 스텝인 이유: && 로 이으면 어느 것이 빨강인지 안 보인다.
      - name: "test: additive-union (첨가물 합집합 저장 · 세션65 C1)"
        run: npm run test:additive-union

      # 세션65 C2 — `U65-2` 「불러오지 못한 N종」(마이그레이션 022).
      #   ★ 022 가 `npm run migrate` 체인에 «이어져» 있는가(세션64c gate #19 재현 방지) /
      #   검출 총 개수가 **마스터 조인 «전»** 인가 / 재제보가 그 값을 깎지 않는가(GREATEST) /
      #   `unlisted` 를 서버가 계산하는가 / null 인 기존 제품이 0 으로 나가 회귀가 없는가 /
      #   022 «미적용» DB 에서 500 이 아니라 null·0 인가 / 0 과 null 이 다른 뜻인가.
      - name: "test: additive-unlisted (불러오지 못한 N종 · 세션65 C2)"
        run: npm run test:additive-unlisted

      # 세션65 C3 — `U64-4`(자작 verified) · `U64-12`(영양 0개 verified) 승격 규칙.
      #   경로 ①이 partial 에서 멈추는가 / partial 승격 자체는 살아 있는가 /
      #   verify_count 가 계속 오르는가 / 경로 ②만 verified 로 가는가 /
      #   **영양 0개로는 verified 에 못 가는가** / 이상치 disputed · admin_verified 보호.
      - name: "test: promotion (승격 규칙 단일화 · 세션65 C3)"
        run: npm run test:promotion

      # 세션66 C7 — `DS-6′` 알레르겐 원칙: 원재료명으로 «판단하지 않는다».
      #   원재료명에만 있는 이름이 contains·mayContain·inferred 어느 축으로도 안 나오는가 /
      #   ★ 반대 케이스 — 제조사 표시란이 있으면 법정 19종 «전수»가 잡히는가
      #     (이것이 없으면 「전부 0을 내는 파서」도 초록이다) /
      #   혼입 축이 살아 있는가 / `inferred` «필드» 자체는 응답 계약으로 남아 있는가.
      - name: "test: allergen-no-infer (DS-6′ 원재료 추론 금지 · 세션66 C7)"
        run: npm run test:allergen-no-infer

      # 세션66 C1~C4 — 제보 데이터 «물리 분리»(DS-7) + 뷰 7-way «논리 통합»(DS-8).
      #   023~026 이 migrate 체인에 이어져 있는가(그리고 025 가 026 보다 앞인가) /
      #   두 영양 테이블의 15컬럼이 이름·타입이 같은가 / 뷰가 «필드 단위»로 통합하는가 /
      #   공공 값을 제보가 못 덮는가(U65-6 이 «영구»가 됐는가) /
      #   제보만 있는 제품에 OFF 라이선스가 안 붙는가 /
      #   reviewed_by 없는 approved 를 «DB 가» 거부하는가(DS-1) /
      #   nutrition_data 에 ocr_crowdsource INSERT 를 «DB 가» 거부하는가(DS-7) /
      #   체인이 2회차에도 서는가.
      - name: "test: contribution-split (제보 데이터 분리 스키마 · 세션66 C1~C4)"
        run: npm run test:contribution-split

      # 세션66 C5 — 승인된 제보를 공식 데이터셋으로 옮기는 «유일한» 경로.
      #   미승인/중복 반영 차단 · DS-9 환산(근거 없으면 «거부», 추정 금지) · 4축 분기 ·
      #   data_inspection found_count=0(U63-6) · undo 가 남의 행을 안 건드림 ·
      #   before/after 기록(없으면 undo 가 원리적으로 불가능) · 등급 강등 금지.
      - name: "test: contribution-apply (승인 반영의 유일한 경로 · 세션66 C5)"
        run: npm run test:contribution-apply

      # 세션66 C6 — 제보 쓰기 경로 분리. 제보가 공식 테이블에 «쓰지 않는다»를
      #   실제 서비스·실제 라우터 호출로 단정한다. U65-6·U65-7·U65-8 소멸 축.
      #   ⚠ 이 스텝이 빨강이면 누군가 crowdsourceService·mergeService 에
      #     공식 테이블 쓰기를 되살렸거나, adminRoutes 에 DELETE 를 되돌린 것이다.
      - name: "test: write-path (제보 쓰기 경로 분리 · 세션66 C6)"
        run: npm run test:write-path

      # 세션67 U66-3 — 관리자 제보 검토 큐 «읽기». 세션66 뒤 실측으로 contribution_review 를
      #   목록으로 읽는 엔드포인트가 0개였다(G1) — 제보가 아무에게도 안 보였다.
      #   ★★ held(승인됐는데 반영 안 됨)와 basis(지금 승인하면 반영될 것인가)가 이 화면의 존재 이유다.
      #   개인정보 무유출(ocr_raw_text·device_id 0회) · 024 미적용 DB 에서 500 아님 ·
      #   limit 상한 200 이 실제로 걸림 · 쓰기 SQL 0줄(조회 전후 행 수 대조).
      #   ⚠ 이 스텝이 빨강이면 누군가 reviewQueueRead 에 쓰기를 넣었거나,
      #     evidence 스크럽을 풀었거나, resolveBasis 호출을 지우고 규칙을 다시 구현한 것이다.
      - name: "test: review-queue-read (관리자 검토 큐 읽기 · 세션67 U66-3)"
        run: npm run test:review-queue-read

      # 세션67 U66-4 — 관리자가 «사람으로서» 채운 표기 기준을 승인 경로가 읽는 축.
      #   ⚠ 이 스텝이 빨강이면 누군가 admin_basis 의 어휘 검사를 풀어 «우회로»로 만들었거나,
      #     환산 근거 없이 통합하도록 P1 을 뒤집었거나, contributions.data 에 관리자 값을 쓴 것이다.
      - name: "test: contribution-apply-basis (관리자 기준 입력 · 세션67 U66-4)"
        run: npm run test:contribution-apply-basis

      # 세션67 U66-3 — 관리자 검토 «화면»의 렌더 회귀.
      #   라이브 public/contribution-review.html 에서 매번 <script> 를 추출해 돌린다
      #   (복사본을 두면 HTML 을 고쳐도 안 바뀌는 «영원한 거짓 초록»이 된다).
      #   ⚠ 이 스텝이 빨강이면 화면이 ① 기준 미상 경고를 안 띄우거나 ② held 를 안 구분하거나
      #     ③ 409 를 성공으로 표시하거나 ④ 모르는 오류 코드를 뭉개거나
      #     ⑤ 근거(note) 없는 기준을 통과시키는 것이다 — 전부 관리자에게 «거짓 신호»다.
      - name: "test: review-ui (관리자 검토 화면 렌더 · 세션67 U66-3)"
        run: npm run test:review-ui

      # ⚠ Firebase 미들웨어는 «남겨 두었다» — health-pick 앱의 사용 여부 미확인.
      #   이 스텝이 빨강이면 누군가 firebaseAuth.js 를 지웠거나 깨뜨린 것이다.
      - name: "test: auth (firebase · 전환기 병존 확인)"
        run: npm run test:auth

      - name: "test: serving"
        run: npm run test:serving

      - name: "test: parity (앱↔정본 파서 동치)"
        run: npm run test:parity

      - name: "test: unit (신호등)"
        run: npm run test:unit

      - name: 63-eval 캡처 파서 (153/153 유지)
        run: node scripts/63-eval-capture-parser.js

      - name: 실패 시 77 로그 보존
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-log-node${{ matrix.node }}
          path: 77.log
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────────
  real-postgres:
    name: 진짜 PostgreSQL 게이트
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # ★ 16 이 하한선이다 — 77 이 쓰는 EXPLAIN (GENERIC_PLAN) 이 PG16 도입 기능.
        #   pglite 는 18.3 이므로 여기는 「아래쪽 경계」를 본다.
        #   ⚠ 운영(Railway) 의 실제 버전은 아직 확인되지 않았다. 확인되면 그 버전을
        #     matrix 에 추가할 것 — 덤프에 server_version 이 안 찍혀 있다(세션48 §6-4).
        image: postgres:16
        env:
          POSTGRES_USER: meokseon
          POSTGRES_PASSWORD: meokseon
          POSTGRES_DB: meokseon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meokseon -d meokseon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://meokseon:meokseon@localhost:5432/meokseon_ci
      # src/config/database.js:14 — DB_SSL 이 'false' 가 아니면 SSL 을 강제한다.
      # 서비스 컨테이너는 SSL 을 지원하지 않으므로 반드시 꺼야 한다.
      DB_SSL: 'false'
      NODE_ENV: test
      # src/config/index.js:9 — PORT 기본값은 3000 이다(4000 아님). 명시해서 고정한다.
      PORT: '4000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # 프로덕션 Dockerfile 과 같은 버전으로 붙인다
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: psql 확인 (없으면 설치)
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: 서버 버전 기록 (운영 버전 대조용)
        run: psql "$DATABASE_URL" -Atc "SHOW server_version;"

      - name: 마이그레이션 1회차 — baseline 이 진짜 PG 에서 도는가
        run: npm run migrate

      - name: pg_trgm 이 실제로 생성됐는가 (pglite 는 못 보는 축)
        run: |
          set -e
          HAS=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_extension WHERE extname='pg_trgm';")
          echo "pg_trgm: $HAS"
          if [ "$HAS" != "1" ]; then
            echo "::error::pg_trgm 이 생성되지 않았다. baseline 의 조건부 블록이 참이 되지 않아 trigram GIN 인덱스 8개가 만들어지지 않는다."
            exit 1
          fi
          N=$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND indexdef LIKE '%gin_trgm_ops%';")
          echo "trigram GIN 인덱스: $N"
          if [ "$N" -lt 8 ]; then
            echo "::error::trigram GIN 인덱스가 $N 개다. 8개여야 한다."
            exit 1
          fi

      - name: GENERATED 컬럼이 실제로 채워지는가 (products.search_text)
        # ⚠ data_source 는 ENUM 이다. 유효 라벨은
        #   public_c005 | public_nutrition | ocr_crowdsource | open_food_facts |
        #   manual_seed | c005_miss_queue.  'manual' 은 없다.
        # 기대값 'cismoketest' 는 .tmp/s49/verify_ci_assertions.js 로 pglite 에서 실측했다.
        run: |
          set -e
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc \
            "INSERT INTO products (barcode, product_name, data_source) VALUES ('9990000000001', '  CI  Smoke  Test  ', 'manual_seed');"
          OUT=$(psql "$DATABASE_URL" -Atc "SELECT search_text FROM products WHERE barcode='9990000000001';")
          psql "$DATABASE_URL" -Atc "DELETE FROM products WHERE barcode='9990000000001';"
          echo "search_text = [$OUT]"
          if [ "$OUT" != "cismoketest" ]; then
            echo "::error::GENERATED ALWAYS AS ... STORED 의 결과가 'cismoketest' 가 아니다 (실측 '$OUT')."
            exit 1
          fi

      - name: ENUM 확장이 적용됐는가 (ALTER TYPE ... ADD VALUE 3종)
        # baseline:122-125 — disputed(004) · orange(008) · c005_miss_queue.
        run: |
          set -e
          psql "$DATABASE_URL" -Atc \
            "SELECT t.typname||':'||e.enumlabel FROM pg_type t JOIN pg_enum e ON e.enumtypid=t.oid
             WHERE (t.typname='verification_status' AND e.enumlabel='disputed')
                OR (t.typname='mfras_grade'         AND e.enumlabel='orange')
                OR (t.typname='data_source_type'    AND e.enumlabel='c005_miss_queue');" | tee enum.log
          N=$(grep -c . enum.log || true)
          echo "적용된 라벨 $N 종"
          if [ "$N" -ne 3 ]; then
            echo "::error::ALTER TYPE ... ADD VALUE 3종이 전부 적용되지 않았다 (disputed / orange / c005_miss_queue) — 실측 $N 종."
            exit 1
          fi

      - name: 마이그레이션 2회차 — 멱등한가
        run: npm run migrate

      - name: 앱이 진짜 PostgreSQL 에 붙어 부팅되고 /api/health 가 200 인가
        run: |
          set -e
          node src/server.js & echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" -o health.json; then
              echo "health OK"; cat health.json; echo
              kill "$(cat server.pid)" 2>/dev/null || true
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/health 가 60초 안에 200 을 내지 않았다."
          kill "$(cat server.pid)" 2>/dev/null || true
          exit 1
